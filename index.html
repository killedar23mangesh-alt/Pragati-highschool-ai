<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pragati Highschool AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #131314; color: #e3e3e3; display: flex; flex-direction: column; height: 100vh; }
    header { padding: 15px 20px; background: #1e1f20; font-size: 18px; font-weight: bold; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
    .header-btns { display: flex; gap: 8px; }
    .top-btn { background: #2b2c2e; color: #fff; border: 1px solid #444; padding: 6px 12px; border-radius: 15px; font-size: 13px; cursor: pointer; }
    #keyBox { display: none; padding: 15px; background: #2b2c2e; border-bottom: 1px solid #444; gap: 8px; }
    #keyBox input { flex: 1; padding: 10px 15px; border-radius: 20px; border: 1px solid #555; background: #131314; color: #fff; font-size: 14px; outline: none; }
    #keyBox button { padding: 10px 16px; border-radius: 20px; border: none; background: #34a853; color: #fff; font-weight: bold; cursor: pointer; }
    #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
    .msg { max-width: 80%; padding: 12px 16px; border-radius: 15px; line-height: 1.5; word-wrap: break-word; }
    .u-msg { align-self: flex-end; background: #2b2c2e; color: #fff; }
    .b-msg { align-self: flex-start; background: #1e1f20; color: #e3e3e3; border: 1px solid #333; }
    .input-area { display: flex; padding: 12px; background: #1e1f20; gap: 8px; align-items: center; }
    #inp { flex: 1; padding: 12px 16px; border-radius: 25px; border: none; background: #2b2c2e; color: #fff; font-size: 16px; outline: none; }
    .icon-btn { width: 45px; height: 45px; border-radius: 50%; border: none; background: #2b2c2e; color: #fff; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .icon-btn.recording { background: #ff4b4b; animation: pulse 1s infinite; }
    #sBtn { padding: 12px 20px; border-radius: 25px; border: none; background: #4b90ff; color: #fff; font-weight: bold; cursor: pointer; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
  </style>
</head>
<body>

  <header>
    <span>Pragati Highschool AI</span>
    <div class="header-btns">
      <button class="top-btn" onclick="toggleKeyBox()">⚙️ API Key</button>
      <button id="voiceToggle" class="top-btn" onclick="toggleVoice()">🔊 ON</button>
    </div>
  </header>

  <div id="keyBox">
    <input type="password" id="apiKeyInput" placeholder="येथे तुमची Gemini API Key पेस्ट करा...">
    <button onclick="saveApiKey()">Save</button>
  </div>

  <div id="chat">
    <div class="msg b-msg">नमस्कार! मी तुमचा AI असिस्टंट आहे. सुरुवात करण्यासाठी वरच्या ⚙️ API Key बटणावर क्लिक करून तुमची की सेव्ह करा.</div>
  </div>

  <div class="input-area">
    <button id="micBtn" class="icon-btn" title="बोलून विचारा">🎤</button>
    <input type="text" id="inp" placeholder="Ask Gemini...">
    <button id="sBtn">Send</button>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const inp = document.getElementById('inp');
    const sBtn = document.getElementById('sBtn');
    const micBtn = document.getElementById('micBtn');
    const voiceToggle = document.getElementById('voiceToggle');
    const keyBox = document.getElementById('keyBox');
    const apiKeyInput = document.getElementById('apiKeyInput');
    let voiceEnabled = true;

    let API_KEY = localStorage.getItem('gemini_api_key') || "";
    if (API_KEY) {
      apiKeyInput.value = API_KEY;
    }

    function toggleKeyBox() {
      keyBox.style.display = keyBox.style.display === 'flex' ? 'none' : 'flex';
    }

    function saveApiKey() {
      const val = apiKeyInput.value.trim();
      if (!val) {
        alert("कृपया बरोबर API Key टाका!");
        return;
      }
      API_KEY = val;
      localStorage.setItem('gemini_api_key', API_KEY);
      keyBox.style.display = 'none';
      addMsg("✅ तुमची API Key सुरक्षितपणे सेव्ह झाली आहे! आता तुम्ही प्रश्न विचारू शकता.", "b-msg");
    }

    function toggleVoice() {
      voiceEnabled = !voiceEnabled;
      voiceToggle.textContent = voiceEnabled ? "🔊 ON" : "🔇 OFF";
      if (!voiceEnabled) window.speechSynthesis.cancel();
    }

    function speakText(text) {
      if (!voiceEnabled) return;
      window.speechSynthesis.cancel();
      const cleanText = text.replace(/[*#_`]/g, '');
      const utterance = new SpeechSynthesisUtterance(cleanText);
      utterance.lang = 'en-IN';
      window.speechSynthesis.speak(utterance);
    }

    function addMsg(text, cls) {
      const div = document.createElement('div');
      div.className = 'msg ' + cls;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    async function askGemini() {
      if (!API_KEY) {
        alert("कृपया आधी वरच्या '⚙️ API Key' बटणावर क्लिक करून तुमची API Key टाका!");
        keyBox.style.display = 'flex';
        return;
      }

      const prompt = inp.value.trim();
      if (!prompt) return;

      addMsg(prompt, 'u-msg');
      inp.value = '';
      const load = addMsg('विचार करत आहे...', 'b-msg');

      try {
        const response = await fetch(`https://googleapis.com{API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }]
          })
        });

        const data = await response.json();
        if (data.error) {
          load.textContent = 'Error: ' + data.error.message;
        } else if (data.candidates && data.candidates.length > 0) {
          const reply = data.candidates[0].content.parts[0].text;
          load.textContent = reply;
          speakText(reply);
        } else {
          load.textContent = 'क्षमस्व, उत्तर मिळू शकले नाही.';
        }
      } catch (err) {
        load.textContent = 'Error: ' + err.message;
      }
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.lang = 'en-IN'; 
      recognition.interimResults = false;

      micBtn.onclick = () => {
        try {
          recognition.start();
          micBtn.classList.add('recording');
          inp.placeholder = "ऐकत आहे... बोला...";
        } catch (e) {
          recognition.stop();
        }
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        inp.value = transcript;
        micBtn.classList.remove('recording');
        inp.placeholder = "Ask Gemini...";
        askGemini();
      };

      recognition.onerror = (event) => {
        micBtn.classList.remove('recording');
        inp.placeholder = "Ask Gemini...";
        if (event.error === 'not-allowed') {
          alert("कृपया ब्राउझरमध्ये माईकची परवानगी (Microphone Permission) द्या.");
        }
      };

      recognition.onend = () => {
        micBtn.classList.remove('recording');
        inp.placeholder = "Ask Gemini...";
      };
    } else {
      micBtn.onclick = () => alert("तुमच्या ब्राउझरमध्ये व्हॉइस सपोर्ट नाही. कृपया Google Chrome वापरा.");
    }

    sBtn.onclick = askGemini;
    inp.onkeypress = (e) => { if (e.key === 'Enter') askGemini(); };
  </script>

</body>
</html>
