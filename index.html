<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pragati Highschool AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #131314; color: #e3e3e3; display: flex; flex-direction: column; height: 100vh; }
    header { padding: 15px 20px; background: #1e1f20; font-size: 20px; font-weight: bold; border-bottom: 1px solid #333; }
    #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
    .msg { max-width: 80%; padding: 12px 16px; border-radius: 15px; line-height: 1.5; word-wrap: break-word; }
    .u-msg { align-self: flex-end; background: #2b2c2e; color: #fff; }
    .b-msg { align-self: flex-start; background: #1e1f20; color: #e3e3e3; border: 1px solid #333; }
    .input-area { display: flex; padding: 15px; background: #1e1f20; gap: 10px; }
    input { flex: 1; padding: 12px 18px; border-radius: 25px; border: none; background: #2b2c2e; color: #fff; font-size: 16px; outline: none; }
    button { padding: 12px 20px; border-radius: 25px; border: none; background: #4b90ff; color: #fff; font-weight: bold; cursor: pointer; }
    button:hover { background: #3a7be0; }
  </style>
</head>
<body>

  <header>Pragati Highschool AI</header>
  <div id="chat">
    <div class="msg b-msg">नमस्कार! मी तुमचा AI असिस्टंट आहे. मी तुम्हाला कशी मदत करू शकतो?</div>
  </div>

  <div class="input-area">
    <input type="text" id="inp" placeholder="Ask Gemini...">
    <button id="sBtn">Send</button>
  </div>

  <script>
    // येथे तुमची API Key पेस्ट करा
    const API_KEY = "AQ.Ab8RN6L22ujJ92I1B91Ieno9JqeGggUYv0BmSDaXidC3JXUrrw"; 
    
    const chat = document.getElementById('chat');
    const inp = document.getElementById('inp');
    const sBtn = document.getElementById('sBtn');

    function addMsg(text, cls) {
      const div = document.createElement('div');
      div.className = 'msg ' + cls;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    async function askGemini() {
      const prompt = inp.value.trim();
      if (!prompt) return;

      addMsg(prompt, 'u-msg');
      inp.value = '';
      const load = addMsg('विचार करत आहे...', 'b-msg');

      try {
        const response = await fetch(`https://googleapis.com{API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }]
          })
        });

        const data = await response.json();
        if (data.error) {
          load.textContent = 'Error: ' + data.error.message;
        } else if (data.candidates && data.candidates.length > 0) {
          load.textContent = data.candidates[0].content.parts[0].text;
        } else {
          load.textContent = 'क्षमस्व, उत्तर मिळू शकले नाही.';
        }
      } catch (err) {
        load.textContent = 'Error: इंटरनेट किंवा सर्व्हरमध्ये समस्या आली आहे.';
      }
    }

    sBtn.onclick = askGemini;
    inp.onkeypress = (e) => { if (e.key === 'Enter') askGemini(); };
  </script>

</body>
</html>
