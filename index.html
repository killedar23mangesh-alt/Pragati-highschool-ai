<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini AI Clone</title>
    <style>
        body {
            background-color: #131314;
            color: #e3e3e3;
            font-family: sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #131314;
        }
        .logo {
            font-size: 20px;
            font-weight: bold;
            background: linear-gradient(74deg, #4285f4, #9b72cb, #d96570);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .btn {
            background: #1e1f20;
            color: #e3e3e3;
            border: 1px solid #333;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
        }
        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .welcome {
            margin: auto;
            text-align: center;
        }
        .welcome h1 {
            font-size: 36px;
            background: linear-gradient(74deg, #4285f4, #9b72cb, #d96570);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .msg-user {
            align-self: flex-end;
            background: #1e1f20;
            padding: 12px 16px;
            border-radius: 18px;
            max-width: 80%;
        }
        .msg-ai {
            align-self: flex-start;
            background: #1a1b1e;
            padding: 12px 16px;
            border-radius: 18px;
            max-width: 85%;
            line-height: 1.5;
            white-space: pre-wrap;
        }
        .input-area {
            padding: 12px 16px 20px;
            display: flex;
            gap: 8px;
            background: #131314;
        }
        .input-box {
            flex: 1;
            display: flex;
            background: #1e1f20;
            border-radius: 30px;
            padding: 6px 12px;
            align-items: center;
        }
        input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 16px;
            padding: 8px;
            outline: none;
        }
        .icon-btn {
            background: transparent;
            border: none;
            color: white;
            font-size: 20px;
            padding: 8px;
            cursor: pointer;
        }
        .listening {
            color: #ff5252;
        }
        #modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            align-items: center;
            justify-content: center;
            z-index: 999;
        }
        .modal-card {
            background: #1e1f20;
            padding: 20px;
            border-radius: 16px;
            width: 85%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .modal-card input {
            background: #131314;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 10px;
        }
        .save-btn {
            background: #8ab4f8;
            color: #000;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Gemini AI</div>
        <div>
            <button type="button" class="btn" id="voiceBtn">🔊 Voice: ON</button>
            <button type="button" class="btn" id="keyBtn">🔑 API Key</button>
        </div>
    </header>

    <div id="chat-box">
        <div class="welcome" id="welcome">
            <h1>Hello, User</h1>
            <p style="color:#9aa0a6;">How can I help you today?</p>
        </div>
    </div>

    <div class="input-area">
        <div class="input-box">
            <input type="text" id="promptInput" placeholder="Ask Gemini...">
            <button type="button" class="icon-btn" id="micBtn">🎤</button>
            <button type="button" class="icon-btn" id="sendBtn">➤</button>
        </div>
    </div>

    <div id="modal">
        <div class="modal-card">
            <h3 style="margin:0;">Enter Gemini API Key</h3>
            <input type="password" id="keyInput" placeholder="Paste AIzaSy... key here">
            <button type="button" class="save-btn" id="saveKeyBtn">Save & Start</button>
        </div>
    </div>

    <script>
        var savedKey = localStorage.getItem('gemini_key') || '';
        var voiceOn = true;
        var historyList = new Array();

        var modal = document.getElementById('modal');
        var keyInput = document.getElementById('keyInput');
        var promptInput = document.getElementById('promptInput');
        var chatBox = document.getElementById('chat-box');
        var voiceBtn = document.getElementById('voiceBtn');
        var micBtn = document.getElementById('micBtn');

        if (!savedKey) {
            modal.style.display = 'flex';
        }

        document.getElementById('keyBtn').addEventListener('click', function() {
            keyInput.value = savedKey;
            modal.style.display = 'flex';
        });

        document.getElementById('saveKeyBtn').addEventListener('click', function() {
            var val = keyInput.value.trim();
            if (val) {
                savedKey = val;
                localStorage.setItem('gemini_key', val);
                modal.style.display = 'none';
            } else {
                alert('Please paste a valid API Key');
            }
        });

        voiceBtn.addEventListener('click', function() {
            voiceOn = !voiceOn;
            voiceBtn.textContent = voiceOn ? '🔊 Voice: ON' : '🔇 Voice: OFF';
            if (!voiceOn && window.speechSynthesis) {
                window.speechSynthesis.cancel();
            }
        });

        function addBubble(text, isUser) {
            var w = document.getElementById('welcome');
            if (w) w.remove();
            var div = document.createElement('div');
            div.className = isUser ? 'msg-user' : 'msg-ai';
            div.textContent = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            return div;
        }

        function speak(text) {
            if (!voiceOn || !window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            var u = new SpeechSynthesisUtterance(text.replace(/[*#_`]/g, ''));
            u.lang = 'en-US';
            window.speechSynthesis.speak(u);
        }

        async function askGemini() {
            var q = promptInput.value.trim();
            if (!q) return;
            if (!savedKey) {
                modal.style.display = 'flex';
                return;
            }

            promptInput.value = '';
            addBubble(q, true);
            var loading = addBubble('Thinking...', false);

            historyList.push({ role: 'user', parts: Array.of({ text: q }) });

            try {
                var res = await fetch('https://googleapis.com' + encodeURIComponent(savedKey), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        systemInstruction: { parts: Array.of({ text: 'Answer clearly in English like Gemini.' }) },
                        contents: historyList
                    })
                });
                var data = await res.json();
                if (!res.ok) {
                    throw new Error((data.error && data.error.message) ? data.error.message : 'API Error');
                }
                var reply = data.candidates.at(0).content.parts.at(0).text;
                loading.textContent = reply;
                historyList.push({ role: 'model', parts: Array.of({ text: reply }) });
                speak(reply);
            } catch (err) {
                loading.textContent = 'Error: ' + err.message;
                historyList.pop();
            }
        }

        document.getElementById('sendBtn').addEventListener('click', askGemini);

        promptInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') askGemini();
        });

        micBtn.addEventListener('click', function() {
            var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) {
                alert('Voice input not supported in this browser. Use Chrome.');
                return;
            }
            var rec = new SR();
            rec.lang = 'en-US';
            rec.onstart = function() { micBtn.classList.add('listening'); };
            rec.onend = function() { micBtn.classList.remove('listening'); };
            rec.onresult = function(e) {
                promptInput.value = e.results.item(0).item(0).transcript;
                askGemini();
            };
            rec.start();
        });
    </script>
</body>
</html>
