<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini AI Clone</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <script src="https://jsdelivr.net"></script>
    <style>
        :root {
            --bg-main: #131314;
            --bg-surface: #1e1f20;
            --bg-hover: #2d2e30;
            --text-primary: #e3e3e3;
            --text-secondary: #9aa0a6;
            --accent-gradient: linear-gradient(74deg, #4285f4 0%, #9b72cb 50%, #d96570 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            font-size: 20px;
            font-weight: 500;
        }

        .logo {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 600;
        }

        .header-controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        button.icon-btn {
            background: var(--bg-surface);
            border: none;
            color: var(--text-primary);
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
        }

        button.icon-btn:hover {
            background: var(--bg-hover);
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            max-width: 820px;
            width: 100%;
            margin: 0 auto;
        }

        .welcome-screen {
            margin: auto;
            text-align: left;
            padding: 20px;
        }

        .welcome-screen h1 {
            font-size: 44px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .welcome-screen p {
            font-size: 22px;
            color: var(--text-secondary);
        }

        .message {
            display: flex;
            gap: 16px;
            line-height: 1.6;
            font-size: 16px;
        }

        .message.user {
            justify-content: flex-end;
        }

        .user-bubble {
            background-color: var(--bg-surface);
            padding: 12px 18px;
            border-radius: 20px;
            max-width: 75%;
            word-wrap: break-word;
        }

        .ai-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--accent-gradient);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            color: white;
        }

        .ai-content {
            flex: 1;
            overflow-x: auto;
        }

        .ai-content p { margin-bottom: 12px; }
        .ai-content pre {
            background: #000;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 10px 0;
        }
        .ai-content code { font-family: monospace; }

        .input-wrapper {
            padding: 16px 24px 24px;
            max-width: 820px;
            width: 100%;
            margin: 0 auto;
        }

        .input-box {
            background-color: var(--bg-surface);
            border-radius: 32px;
            display: flex;
            align-items: center;
            padding: 8px 16px;
            gap: 10px;
            border: 1px solid transparent;
        }

        .input-box:focus-within {
            border-color: #444746;
            background-color: #242628;
        }

        input.chat-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 16px;
            padding: 10px;
            outline: none;
        }

        .action-btn {
            background: transparent;
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: background 0.2s;
        }

        .action-btn:hover {
            background: var(--bg-hover);
        }

        .action-btn.listening {
            background: #d96570;
            color: white;
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal-content {
            background: var(--bg-surface);
            padding: 24px;
            border-radius: 16px;
            width: 90%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .modal-content input {
            background: var(--bg-main);
            border: 1px solid #444746;
            border-radius: 8px;
            padding: 12px;
            color: white;
            width: 100%;
        }

        .save-btn {
            background: #8ab4f8;
            color: #131314;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Gemini AI</div>
        <div class="header-controls">
            <button class="icon-btn" id="voice-toggle" onclick="toggleVoiceOutput()">🔊 Voice: ON</button>
            <button class="icon-btn" onclick="openModal()">🔑 API Key</button>
        </div>
    </header>

    <div id="chat-container">
        <div class="welcome-screen" id="welcome-screen">
            <h1>Hello, User</h1>
            <p>How can I help you today?</p>
        </div>
    </div>

    <div class="input-wrapper">
        <div class="input-box">
            <input type="text" class="chat-input" id="user-input" placeholder="Ask Gemini..." onkeypress="handleKeyPress(event)">
            <button class="action-btn" id="mic-btn" onclick="startVoiceInput()" title="Speak">🎤</button>
            <button class="action-btn" id="send-btn" onclick="sendMessage()" title="Send">➤</button>
        </div>
    </div>

    <div class="modal" id="api-modal">
        <div class="modal-content">
            <h3>Enter Gemini API Key</h3>
            <p style="font-size: 13px; color: #9aa0a6;">Your key is saved locally in your browser and never uploaded to GitHub.</p>
            <input type="password" id="api-key-input" placeholder="AIzaSy...">
            <button class="save-btn" onclick="saveApiKey()">Save & Start</button>
        </div>
    </div>

    <script>
        let apiKey = localStorage.getItem('gemini_api_key') || '';
        let voiceOutputEnabled = true;
        let chatHistory = new Array();
        let isGenerating = false;

        window.onload = function() {
            if (!apiKey) {
                openModal();
            }
        };

        function openModal() {
            document.getElementById('api-key-input').value = apiKey;
            document.getElementById('api-modal').style.display = 'flex';
        }

        function saveApiKey() {
            const key = document.getElementById('api-key-input').value.trim();
            if (key) {
                apiKey = key;
                localStorage.setItem('gemini_api_key', key);
                document.getElementById('api-modal').style.display = 'none';
            } else {
                alert("Please enter a valid API key.");
            }
        }

        function toggleVoiceOutput() {
            voiceOutputEnabled = !voiceOutputEnabled;
            const btn = document.getElementById('voice-toggle');
            btn.textContent = voiceOutputEnabled ? '🔊 Voice: ON' : '🔇 Voice: OFF';
            if (!voiceOutputEnabled && 'speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter' && !isGenerating) {
                sendMessage();
            }
        }

        function startVoiceInput() {
            if (isGenerating) return;
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Your browser does not support Voice Input. Please use Chrome or Edge.");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = false;
            const micBtn = document.getElementById('mic-btn');
