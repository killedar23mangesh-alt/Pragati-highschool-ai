<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gemini AI</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
  body{background:#131314;color:#e3e3e3;display:flex;flex-direction:column;height:100vh}
  header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px}
  .logo{font-size:20px;font-weight:700;background:linear-gradient(74deg,#4285f4,#9b72cb,#d96570);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .btn{background:#1e1f20;color:#e3e3e3;border:1px solid #333;padding:7px 12px;border-radius:18px;font-size:13px;cursor:pointer}
  #chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
  .welcome{margin:auto;text-align:center}
  .welcome h1{font-size:36px;background:linear-gradient(74deg,#4285f4,#9b72cb,#d96570);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
  .u-msg{align-self:flex-end;background:#1e1f20;padding:11px 16px;border-radius:18px;max-width:80%;word-wrap:break-word}
  .a-msg{align-self:flex-start;background:#1a1b1e;padding:12px 16px;border-radius:18px;max-width:88%;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
  .bar{padding:10px 14px 18px;display:flex}
  .box{flex:1;display:flex;background:#1e1f20;border-radius:28px;padding:5px 12px;align-items:center}
  .box input{flex:1;background:transparent;border:none;color:#fff;font-size:16px;padding:8px;outline:none}
  .ibtn{background:transparent;border:none;color:#fff;font-size:20px;padding:8px;cursor:pointer}
  .rec{color:#ff5252}
  #modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);align-items:center;justify-content:center;z-index:99}
  .card{background:#1e1f20;padding:20px;border-radius:16px;width:88%;max-width:360px;display:flex;flex-direction:column;gap:12px}
  .card input{background:#131314;border:1px solid #444;border-radius:8px;padding:11px;color:#fff;font-size:15px}
  .sbtn{background:#8ab4f8;color:#000;border:none;padding:11px;border-radius:8px;font-weight:700;cursor:pointer}
</style>
</head>
<body>

<header>
  <div class="logo">Gemini AI</div>
  <div>
    <button type="button" class="btn" id="vBtn">🔊 Voice: ON</button>
    <button type="button" class="btn" id="kBtn">🔑 API Key</button>
  </div>
</header>

<div id="chat">
  <div class="welcome" id="wel">
    <h1>Hello, User</h1>
    <p style="color:#9aa0a6">How can I help you today?</p>
  </div>
</div>

<div class="bar">
  <div class="box">
    <input type="text" id="inp" placeholder="Ask Gemini...">
    <button type="button" class="ibtn" id="mBtn">🎤</button>
    <button type="button" class="ibtn" id="sBtn">➤</button>
  </div>
</div>

<div id="modal">
  <div class="card">
    <h3>Enter Gemini API Key</h3>
    <input type="text" id="kInp" placeholder="Paste API key here">
    <button type="button" class="sbtn" id="saveBtn">Save & Start</button>
  </div>
</div>

<script>
  var key = (localStorage.getItem('g_key') || '').trim();
  var voice = true;
  var hist = new Array();
  var modal = document.getElementById('modal');
  var kInp = document.getElementById('kInp');
  var inp = document.getElementById('inp');
  var chat = document.getElementById('chat');
  var vBtn = document.getElementById('vBtn');
  var mBtn = document.getElementById('mBtn');

  if (!key) modal.style.display = 'flex';

  document.getElementById('kBtn').onclick = function() {
    kInp.value = key;
    modal.style.display = 'flex';
  };

  document.getElementById('saveBtn').onclick = function() {
    var v = kInp.value.trim();
    if (v) {
      key = v;
      localStorage.setItem('g_key', v);
      modal.style.display = 'none';
    }
  };

  vBtn.onclick = function() {
    voice = !voice;
    vBtn.textContent = voice ? '🔊 Voice: ON' : '🔇 Voice: OFF';
    if (!voice && window.speechSynthesis) window.speechSynthesis.cancel();
  };

  function addMsg(txt, isUser) {
    var w = document.getElementById('wel');
    if (w) w.remove();
    var d = document.createElement('div');
    d.className = isUser ? 'u-msg' : 'a-msg';
    d.textContent = txt;
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
    return d;
  }

  function speak(txt) {
    if (!voice || !window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(txt.replace(/[*#_`]/g, ''));
    u.lang = 'en-US';
    window.speechSynthesis.speak(u);
  }

  async function runAPI(model, payload) {
    var host = 'generativelanguage' + '.googleapis.com';
    var url = 'https://' + host + '/v1beta/models/' + model + ':generateContent?key=' + encodeURIComponent(key);
    var res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    var data = await res.json();
    if (!res.ok) throw new Error((data.error && data.error.message) ? data.error.message : 'Error ' + res.status);
    return data.candidates.at(0).content.parts.at(0).text;
  }

  async function send() {
    var q = inp.value.trim();
    if (!q) return;
    if (!key) { modal.style.display = 'flex'; return; }
    inp.value = '';
    addMsg(q, true);
    var load = addMsg('Thinking...', false);
    var pText = (hist.length === 0) ? 'Answer clearly in English like Gemini: ' + q : q;
    hist.push({ role: 'user', parts: Array.of({ text: pText }) });
    try {
      var ans;
      try { ans = await runAPI('gemini-2.5-flash', { contents: hist }); }
      catch (e) { ans = await runAPI('gemini-2.0-flash', { contents: hist }); }
      load.textContent = ans;
      hist.push({ role: 'model', parts: Array.of({ text: ans }) });
      speak(ans);
    } catch (err) {
      load.textContent = 'Error: ' + err.message;
      hist.pop();
    }
  }

  document.getElementById('sBtn').onclick = send;
  inp.onkeypress = function(e) { if (e.key === 'Enter') send(); };

  mBtn.onclick = function() {
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { alert('Use Chrome for Voice Input'); return; }
    var r = new SR();
    r.lang = 'en-US';
    r.onstart = function() { mBtn.classList.add('rec'); };
    r.onend = function() { mBtn.classList.remove('rec'); };
    r.onresult = function(e) {
      inp.value = e.results.item(0).item(0).transcript;
      send();
    };
    r.start();
  };
</script>
</body>
</html>
